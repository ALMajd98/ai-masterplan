<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
    <defs>
        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3b82f6"/>
            <stop offset="100%" style="stop-color:#8b5cf6"/>
        </linearGradient>
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#3b82f6"/>
            <stop offset="100%" style="stop-color:#8b5cf6"/>
        </linearGradient>
    </defs>
    
    <!-- Icon -->
    <g transform="translate(10, 10)">
        <rect x="0" y="0" width="80" height="80" rx="16" ry="16" fill="url(#logoGrad)"/>
        <rect x="20" y="20" width="40" height="40" rx="6" ry="6" fill="rgba(255,255,255,0.9)"/>
        <circle cx="40" cy="40" r="5" fill="url(#logoGrad)"/>
        
        <!-- Lines -->
        <rect x="28" y="8" width="2.5" height="10" fill="rgba(255,255,255,0.9)" rx="1"/>
        <rect x="38" y="8" width="2.5" height="10" fill="rgba(255,255,255,0.9)" rx="1"/>
        <rect x="48" y="8" width="2.5" height="10" fill="rgba(255,255,255,0.9)" rx="1"/>
        
        <rect x="28" y="62" width="2.5" height="10" fill="rgba(255,255,255,0.9)" rx="1"/>
        <rect x="38" y="62" width="2.5" height="10" fill="rgba(255,255,255,0.9)" rx="1"/>
        <rect x="48" y="62" width="2.5" height="10" fill="rgba(255,255,255,0.9)" rx="1"/>
        
        <rect x="8" y="28" width="10" height="2.5" fill="rgba(255,255,255,0.9)" rx="1"/>
        <rect x="8" y="38" width="10" height="2.5" fill="rgba(255,255,255,0.9)" rx="1"/>
        <rect x="8" y="48" width="10" height="2.5" fill="rgba(255,255,255,0.9)" rx="1"/>
        
        <rect x="62" y="28" width="10" height="2.5" fill="rgba(255,255,255,0.9)" rx="1"/>
        <rect x="62" y="38" width="10" height="2.5" fill="rgba(255,255,255,0.9)" rx="1"/>
        <rect x="62" y="48" width="10" height="2.5" fill="rgba(255,255,255,0.9)" rx="1"/>
    </g>
    
    <!-- Text -->
    <text x="110" y="48" font-family="Arial, sans-serif" font-size="28" font-weight="700" 
          fill="url(#textGrad)">AI Master</text>
    <text x="110" y="75" font-family="monospace" font-size="14" font-weight="500" 
          fill="#64748b">Plan v4.0</text>
</svg>